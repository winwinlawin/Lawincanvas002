<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12201a">
  <title>Lawin Canvas AR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <div id="welcome-screen" aria-label="Lawin Canvas AR welcome screen">
    <div class="dust-field" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="welcome-inner">
      <div class="logo-glow" aria-hidden="true"></div>
      <img class="logo" src="assets/icons/logo.png" alt="Lawin Canvas" width="330" height="330" fetchpriority="high">
      <p class="welcome-copy">
        Experience art beyond the canvas.<br>
        Bring the painting to life with Lawin Canvas AR.
      </p>
      <button id="start-btn" class="begin-button" type="button">BEGIN AR EXPERIENCE</button>
    </div>

    <p class="footer-tagline">BRING ART TO LIFE</p>
  </div>

  <div id="scan-message" role="status" aria-live="polite">
    <span class="scan-dot" aria-hidden="true"></span>
    Point your camera at the painting
  </div>

  <a-scene
    id="ar-scene"
    embedded
    mindar-image="
      imageTargetSrc: assets/targets/LC002.mind;
      uiError: no;
      uiLoading: no;
      uiScanning: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="video-LC002"
        src="assets/videos/LC002.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-0" mindar-image-target="targetIndex: 0">
      <a-video
        id="videoPlane"
        src="#video-LC002"
        width="0.6667"
        height="1"
        position="0 0 0"
        material="shader: flat;"
      ></a-video>
    </a-entity>
  </a-scene>

  <script src="app.js" defer></script>
</body>
</html>
